; Two build targets share one portable core (firmware/src/core):
;   native   - laptop: unit tests (pio test -e native) and the simulator (pio run -e native)
;   esp32dev - the hub firmware (pio run -e esp32dev). The same folder opens in the Arduino IDE.

[platformio]
src_dir = firmware
default_envs = native, esp32dev

[env]
build_flags =
    -Wall
    -Wextra
    ; no fused multiply-add, so float results match the Python prototype bit for bit
    -ffp-contract=off

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
    -I firmware/src/core
; build the core and the simulator, not the ESP32 sketch
build_src_filter = -<*> +<src/core/> +<../sim/>
test_framework = unity
; tests link the core built above (sim.cpp skips its main() under PIO_UNIT_TESTING)
test_build_src = yes

[env:esp32dev]
; pioarduino fork: the official espressif32 platform only ships Arduino core 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
