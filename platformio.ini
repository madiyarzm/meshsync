; Two build targets share one portable core (lib/core):
;   native   - laptop: unit tests (pio test -e native) and the simulator (pio run -e native)
;   esp32dev - the hub firmware for the ESP32 (pio run -e esp32dev)

[platformio]
default_envs = native, esp32dev

[env]
build_flags =
    -Wall
    -Wextra
    ; no fused multiply-add, so float results match the Python prototype bit for bit
    -ffp-contract=off

[env:native]
platform = native
build_flags =
    ${env.build_flags}
    -std=c++17
; build the simulator instead of the ESP32 app in src/
build_src_filter = -<*> +<../sim/>
test_framework = unity

[env:esp32dev]
; pioarduino fork: the official espressif32 platform only ships Arduino core 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
